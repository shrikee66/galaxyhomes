name: Build GalaxyHomes Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and Unzip Source
        run: |
          rm -rf src pom.xml output.bin index.html .gradle target
          unzip -o plugin.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyHomes-Plugin
          path: target/GalaxyHomes-*.jar
          
