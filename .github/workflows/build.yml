name: Test Unzip Only

on: [push]

jobs:
  unzip-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace completely
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'plugin.zip' ! -name '.github' -exec rm -rf {} +

      - name: Unzip plugin source
        run: unzip -o plugin.zip

      - name: List extracted files to verify
        run: ls -R
        
