name: Build GalaxyHomes Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace completely
        run: |
          # Purane conflicts hatane ke liye workspace saaf karein (plugin.zip aur .git ko chhod kar)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'plugin.zip' ! -name '.github' -exec rm -rf {} +

      - name: Unzip plugin source
        run: unzip -o plugin.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyHomes-Plugin
          path: target/GalaxyHomes-*.jar
          
