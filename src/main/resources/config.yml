  tpa-toggled-on: "&aYou are now accepting teleport requests."
  tpa-toggled-off: "&cYou are now blocking teleport requests."
  tpa-cooldown: "&cYou must wait &e{time}s &cbefore sending another request!"

  # General teleport
  teleport-cancelled-move: "&cTeleport cancelled: you moved!"
  teleport-cancelled-damage: "&cTeleport cancelled: you took damage!"
  teleport-cancelled-command: "&cTeleport cancelled: you executed a command!"
  teleport-cooldown: "&cYou must wait &e{time}s &cbefore teleporting again!"

  # Admin
  admin-reload: "&aConfiguration reloaded successfully!"
  admin-backup: "&aPlayer data backed up to &e{file}&a!"
  admin-stats: "&8&m----------------&8[ &bGalaxyHomes Stats &8]&m----------------"
  admin-stats-players: "&ePlayers with data: &f{count}"
  admin-stats-homes: "&eTotal homes: &f{count}"
  admin-stats-tpa: "&eActive TPA requests: &f{count}"

# ============================================================
# DATABASE SETTINGS
# ============================================================
database:
  folder: "players"
  backup-on-save: true
  backup-folder: "backups"
  max-backups: 10
  
