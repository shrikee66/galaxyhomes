
# GalaxyHomes Configuration
# Cross-platform homes, TPA, and spawn system

# ============================================================
# TELEPORTATION SETTINGS
# ============================================================
teleport:
  warmups:
    home: 3
    spawn: 3
    tpa: 3
    tpahere: 3

  cooldown-seconds: 5

  countdown:
    enabled: true
    format: "&aTeleporting in &e{time}&as..."
    cancel-on-move: true
    cancel-on-damage: true
    move-threshold: 0.5

# ============================================================
# TPA SETTINGS
# ============================================================
tpa:
  expire-seconds: 60
  cross-platform: true
  max-outgoing: 1
  max-incoming: 5

# ============================================================
# HOME SETTINGS
# ============================================================
homes:
  max-homes: -1
  default-name: "home"
  allow-spaces: true
  max-name-length: 32
  auto-save-interval: 5

# ============================================================
# SPAWN SETTINGS
# ============================================================
spawn:
  world: ""
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# ============================================================
# GUI SETTINGS (Java Edition)
# ============================================================
gui:
  title: "&8&lGalaxy &b&lHomes"
  rows-per-page: 4
  home-item: "WRITTEN_BOOK"
  manage-item: "OAK_SIGN"
  prev-page-item: "ARROW"
  next-page-item: "ARROW"
  close-item: "BARRIER"
  fill-empty: true
  fill-item: "GRAY_STAINED_GLASS_PANE"

  animation:
    enabled: true
    type: "SLIDE"
    duration-ticks: 10

# ============================================================
# BEDROCK GUI SETTINGS
# ============================================================
bedrock:
  enabled: true
  form-title: "§8§lGalaxy §b§lHomes"
  use-player-heads: true
  picker-page-size: 10
  confirm-button: "GREEN_WOOL"
  cancel-button: "RED_WOOL"
  auto-show-requests: true

# ============================================================
# SOUNDS SETTINGS
# ============================================================
sounds:
  enabled: true

  countdown:
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 0.5
    pitch: 1.2

  success:
    sound: "ENTITY_ENDERMAN_TELEPORT"
    volume: 1.0
    pitch: 1.0

  gui-open:
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 0.5
    pitch: 1.0

  gui-close:
    sound: "UI_BUTTON_CLICK"
    volume: 0.5
    pitch: 1.0

  button-click:
    sound: "UI_BUTTON_CLICK"
    volume: 0.5
    pitch: 1.0

  error:
    sound: "ENTITY_VILLAGER_NO"
    volume: 0.5
    pitch: 1.0

  tpa-received:
    sound: "BLOCK_NOTE_BLOCK_BELL"
    volume: 0.7
    pitch: 1.0

  tpa-sent:
    sound: "BLOCK_NOTE_BLOCK_CHIME"
    volume: 0.5
    pitch: 1.0

# ============================================================
# PARTICLES SETTINGS
# ============================================================
particles:
  enabled: true

  destination:
    type: "END_ROD"
    count: 20
    offset-x: 0.5
    offset-y: 1.0
    offset-z: 0.5
    speed: 0.1

  warmup:
    type: "VILLAGER_HAPPY"
    count: 5
    offset-x: 0.3
    offset-y: 0.5
    offset-z: 0.3
    speed: 0.05
    interval-ticks: 20

# ============================================================
# MESSAGES
# ============================================================
messages:
  prefix: "&8[&bGalaxyHomes&8] "
  no-permission: "&cYou don't have permission to do that!"
  player-only: "&cThis command can only be used by players!"
  player-not-found: "&cPlayer '&e{player}&c' not found!"
  player-offline: "&cPlayer '&e{player}&c' is not online!"
  cannot-target-self: "&cYou cannot target yourself!"

  # Homes
  home-set: "&aHome '&e{name}&a' set at your current location!"
  home-updated: "&aHome '&e{name}&a' updated!"
  home-deleted: "&aHome '&e{name}&a' deleted!"
  home-not-found: "&cHome '&e{name}&c' not found!"
  home-teleporting: "&aTeleporting to home '&e{name}&a'..."
  home-teleported: "&aSuccessfully teleported to home '&e{name}&a'!"
  home-list-empty: "&cYou don't have any homes yet! Use &e/sethome <name>&c to create one."
  home-list-header: "&8&m----------------&8[ &b&lYour Homes &8]&m----------------"
  home-list-entry: "&e{name} &7- &8World: &f{world} &8| &f{x}, {y}, {z}"
  home-list-footer: "&8&m------------------------------------------------"
  home-limit-reached: "&cYou have reached the maximum number of homes (&e{limit}&c)!"
  home-name-too-long: "&cHome name is too long! Maximum &e{max}&c characters."
