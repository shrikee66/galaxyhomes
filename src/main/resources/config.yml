  # TPA
  tpa-sent: "&aTeleport request sent to &e{player}&a! Expires in &e{time}s&a."
  tpa-here-sent: "&aTeleport request sent to &e{player}&a (requesting them to teleport to you)! Expires in &e{time}s&a."
  tpa-received: "&e{player} &awants to teleport to you! &e/tpaccept &aor &e/tpdeny &a(&e{time}s&a)"
  tpa-here-received: "&e{player} &awants you to teleport to them! &e/tpaccept &aor &e/tpdeny &a(&e{time}s&a)"
  tpa-accepted: "&aTeleport request from &e{player} &aaccepted! Teleporting..."
  tpa-denied: "&cTeleport request from &e{player} &cdenied."
  tpa-expired: "&cTeleport request from &e{player} &chas expired."
  tpa-cancelled: "&aYour teleport request to &e{player} &ahas been cancelled."
  tpa-no-request: "&cYou have no pending teleport requests!"
  tpa-no-incoming: "&cYou have no incoming teleport requests!"
